stages:
  - test
  - apply

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

template-contract:
  stage: test
  image: node:20-bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends jq ripgrep ruby ca-certificates
    - npm install --global @dasmeta/meta-cli@0.0.16
  script:
    - bash scripts/ci/run-template-tests.sh

apply:
  stage: apply
  image: dasmeta/meta
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - create
  variables:
    ROOT_DIR: "/build"
    GIT_TOKEN: $GIT_AUTH_TOKEN
    TERRAFORM_CLOUD_TOKEN: $TERRAFORM_CLOUD_TOKEN
    AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
    AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
