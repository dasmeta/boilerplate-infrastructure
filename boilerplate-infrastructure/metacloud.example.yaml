# Recommended Terraform Cloud profile. Copy to metacloud.yaml during bootstrap
# and replace example identifiers. Never put tokens or cloud credentials here.
driver: terraform-cloud
terraform_cloud_org: example-organization
terraform_cloud_workspace: infrastructure-management
git_provider: github
git_org: example-organization
git_repo: customer-infrastructure
git_branch: main
git_enabled: true
yaml_dir: .
root_dir: _terraform
target_dir: _terraform
handler_version: "~> 2.5.0"
auto_apply: false

# Supported by meta-cli >= 0.0.15.
aws:
  enabled: false
tfe_token_variable_set:
  enabled: true
  name: tfe-token
